<a class="skip-link" href="#about-section">Skip to content</a>
<app-navbar></app-navbar>

<header id="top-section" class="top-section">
  <app-contour-lamp align="xMaxYMid"></app-contour-lamp>
  <app-top-view></app-top-view>
</header>

<main>
  <section id="about-section" class="page-section" aria-label="About me">
    <app-about-section></app-about-section>
  </section>

  <section id="skills-section" class="page-section" aria-labelledby="skills-heading">
    <h2 id="skills-heading" class="section-heading" tabindex="-1">What I work with</h2>
    <app-skills-orbit></app-skills-orbit>
  </section>

  <section id="projects-section" class="page-section" aria-labelledby="projects-heading">
    <h2 id="projects-heading" class="section-heading" tabindex="-1">Projects</h2>
    <app-project-showcase></app-project-showcase>
  </section>

  <section class="words-section" aria-label="How I like to work">
    <div class="words-section__rows" [class.is-paused]="wordsPaused()">
      <app-sliding-text [words]="wordList" direction="ltr" [duration]="38"></app-sliding-text>
      <app-sliding-text [words]="secondWordList" direction="rtl" [duration]="46" [offset]="1"></app-sliding-text>
    </div>
    <p class="sr-only">{{ allWords }}</p>
    <button type="button" class="motion-btn words-section__pause" [attr.aria-pressed]="wordsPaused()" (click)="wordsPaused.set(!wordsPaused())"
            [attr.aria-label]="wordsPaused() ? 'Play sliding words' : 'Pause sliding words'" [title]="wordsPaused() ? 'Play sliding words' : 'Pause sliding words'">
      @if (wordsPaused()) {
        <svg lucidePlay></svg>
      } @else {
        <svg lucidePause></svg>
      }
    </button>
  </section>

  <section id="contact-section" class="contact-section" aria-label="Contact">
    <app-contour-lamp [peaks]="contactPeaks" [levels]="20"></app-contour-lamp>
    <app-contact-section></app-contact-section>
  </section>
</main>

<app-footer></app-footer>
