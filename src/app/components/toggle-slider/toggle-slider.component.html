<div class="toggle-container">
  <label class="toggle-container__flex" for="theme-toggle">
    <svg lucideSun aria-hidden="true"></svg>
    <input class="checkbox" [(ngModel)]="isChecked" (ngModelChange)="onCheckboxChange()"
           type="checkbox" role="switch" id="theme-toggle" [attr.aria-checked]="isChecked"/>
    <span class="sr-only">Dark mode</span>
    <span class="switch" aria-hidden="true"></span>
    <svg lucideMoon aria-hidden="true"></svg>
  </label>
</div>
