<nav class="nav" [class.is-scrolled]="scrolled()" [class.is-open]="menuOpen()" aria-label="Main">
  <a class="nav__brand" href="#top-section" (click)="go('top-section', $event)">
    Niels Lazaroms
  </a>

  <ul class="nav__links" id="main-menu">
    @for (link of links; track link.id) {
      <li>
        <a class="nav__link" [href]="'#' + link.id" (click)="go(link.id, $event)"
           [attr.aria-current]="active() === link.id ? 'location' : null">{{ link.label }}</a>
      </li>
    }
    <li class="nav__theme"><app-toggle-slider></app-toggle-slider></li>
    <li><a class="btn btn--primary nav__contact" href="#contact-section" (click)="go('contact-section', $event)">Contact</a></li>
  </ul>

  <button class="nav__toggle" type="button" (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()" aria-controls="main-menu"
          [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'">
    @if (menuOpen()) {
      <svg lucideX></svg>
    } @else {
      <svg lucideMenu></svg>
    }
  </button>
</nav>
